<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swarup Mahapatra | Resume</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="styles.css"/>
    <script src="index.js" defer></script>
  </head>
  <body>
    <div class="flex-container container">
      <div class="left">
        <h1 class="name heading-color profile-name"></h1>
        <h2 class="heading-color profile-role"></h2>
        <div class="contact contact-items">
        </div>
        <div>
          <h2 class="heading-color">Education</h2>
          <div class="degree heading-color education-degree"></div>
          <i class="education-inst-duration"></i>
          <br>
          <i class="education-cgpa"></i>
        </div>
        <div class="skills">
          <h2 class="heading-color">Key Skills</h2>
          <ul class="key-skills-list"></ul>
        </div>
      </div>
      <div class="right">
        <div class="summary">
          <h2 class="heading-color">Summary</h2>
          <p class="profile-summary"></p>
        </div>
        <div>
          <h2 class="heading-color">Professional Experience</h2>
          <div class="all-experiences">
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
