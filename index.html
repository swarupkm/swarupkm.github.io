<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swarup Mahapatra | Resume</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="styles.css"/>
    <link rel="stylesheet" media="print" href="print.css"/>
    <script src="index.js" defer></script>
  </head>
  <body>
    <!-- Plain-text ATS header: no background, no FA icons, no border.
         Sits before the styled container so it is always first in the PDF
         text stream, regardless of Chrome's compositing order. -->
    <div class="ats-pre-header"></div>
    <div class="flex-container container">
      <div class="profile-header">
        <h1 class="name heading-color profile-name"></h1>
        <h2 class="heading-color profile-role"></h2>
        <div class="contact contact-items"></div>
      </div>
      <div class="summary">
        <h2 class="heading-color">Summary</h2>
        <p class="profile-summary"></p>
      </div>
      <div class="content-columns">
        <div class="left">
          <div>
            <h2 class="heading-color">Education</h2>
            <div class="degree heading-color education-degree"></div>
            <i class="education-inst-duration"></i>
            <br>
            <i class="education-cgpa"></i>
          </div>
          <div class="skills">
            <h2 class="heading-color">Key Skills</h2>
            <ul class="key-skills-list"></ul>
          </div>
        </div>
        <div class="right">
          <div>
            <h2 class="heading-color">Professional Experience</h2>
            <div class="all-experiences"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
